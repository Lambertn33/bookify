services:
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    ports:
      - 8000:8000
    volumes:
      - ./server:/var/www/html
    container_name: books-store-server
    working_dir: /var/www/html
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_KEY: base64:dummykeydummykeydummykeydummykeydummykeydummy=
      APP_URL: http://localhost:8000
      LOG_CHANNEL: stack
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: books-store
      DB_USERNAME: books-store
      DB_PASSWORD: books-store
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "composer install --no-dev --prefer-dist --no-interaction &&
             php artisan migrate --force &&
             php artisan serve --host=0.0.0.0 --port=8000"
  db:
    image: mysql:8.0
    container_name: books-store-db
    restart: unless-stopped
    ports:
      - 3306:3306
    environment:
      MYSQL_ROOT_PASSWORD: books-store
      MYSQL_DATABASE: books-store
      MYSQL_USER: books-store
      MYSQL_PASSWORD: books-store
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pbooks-store"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    volumes:
      - books-store-db-data:/var/lib/mysql
volumes:
  books-store-db-data: